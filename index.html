<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8cd7f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="ZASYSTEM.147 Portal">
<title>ZASYSTEM.147 Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root {
    --bg: #eef5fc;
    --card: #ffffff;
    --text: #0b2545;
    --muted: #5b7090;
    --primary: #1565c0;
    --primary-dark: #0d47a1;
    --today: #1565c0;
    --border: #d6e4f5;
    --cell: #f4f8fd;
  }
  body.dark {
    --bg: #0a1628;
    --card: #112240;
    --text: #e6f0ff;
    --muted: #8fa6c8;
    --primary: #42a5f5;
    --primary-dark: #1e88e5;
    --today: #1e88e5;
    --border: #1f3a60;
    --cell: #0d1d36;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: transparent;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    transition: background 0.3s, color 0.3s;
  }
  header {
    background: linear-gradient(135deg, #0d47a1, #1e88e5);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.5px; }
  header p { margin: 2px 0 0; opacity: 0.85; font-size: 0.88rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .ctrl-btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 10px 14px;
    min-height: 44px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.3); }
  .install-btn { background: #fff; color: var(--primary-dark); border: none; }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 14px calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(13, 71, 161, 0.08);
  }
  html {
    min-height: 100%;
    background-color: #0d47a1;
    background-image: linear-gradient(160deg, #0d47a1 0%, #1565c0 45%, #42a5f5 100%);
    background-repeat: no-repeat;
  }
  html.dark {
    background-color: #0a1628;
    background-image: linear-gradient(160deg, #050d1c 0%, #0a1628 50%, #112240 100%);
  }
  .section-title {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--primary);
    margin: 0;
  }

  /* ---------- clock ---------- */
  .clock-card { text-align: center; margin-bottom: 18px; position: relative; overflow: hidden; }
  .clock-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(66,165,245,0.18), transparent 60%);
    pointer-events: none;
  }
  .clock-wrap {
    position: relative;
    display: inline-flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    padding: 6px 12px;
    border-radius: 16px;
    transition: transform 0.15s, background 0.2s;
  }
  .clock-wrap:hover { background: rgba(21,101,192,0.06); }
  .clock-wrap:active { transform: scale(0.97); }
  .clock {
    font-size: clamp(2.6rem, 13vw, 5.2rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    letter-spacing: 1px;
    line-height: 1.1;
    display: flex;
    align-items: center;
  }
  .clock .colon { animation: blink 1s steps(1, end) infinite; margin: 0 2px; }
  .clock .sec { display: inline-block; min-width: 1.3ch; }
  .clock .sec.tick { animation: tick 0.25s ease-out; }
  @keyframes blink { 50% { opacity: 0.2; } }
  @keyframes tick { from { transform: translateY(-6px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  .ampm {
    font-size: clamp(0.9rem, 3vw, 1.3rem);
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    padding: 4px 10px;
    border-radius: 8px;
    margin-top: 8px;
    letter-spacing: 1px;
  }
  .ampm[hidden] { display: none; }
  .mode-hint { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
  .date-line { font-size: 1rem; margin-top: 8px; position: relative; }
  .hijri-line { font-size: 0.98rem; color: var(--muted); margin-top: 4px; position: relative; }

  .adjust {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    position: relative;
  }
  .adj-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
  }
  .adj-val { min-width: 56px; text-align: center; font-weight: 700; color: var(--text); }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    margin-bottom: 18px;
  }
  .cal-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .cal-month { font-weight: 600; color: var(--muted); font-size: 0.92rem; }
  .cal {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
  }
  .cal .wd { font-size: 0.72rem; font-weight: 700; color: var(--muted); padding: 6px 0; }
  .cal .cell {
    background: var(--cell);
    border-radius: 8px;
    padding: 9px 0;
    font-size: 0.95rem;
    transition: transform 0.15s, background 0.15s;
  }
  .cal .cell:not(.empty):hover { transform: scale(1.08); background: var(--border); }
  .cal .cell.empty { background: transparent; }
  .cal .cell.today { background: var(--today); color: #fff; font-weight: 700; }

  /* ---------- system buttons ---------- */
  .links-title { margin: 0 0 12px; }
  .links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    text-decoration: none;
    padding: 18px;
    min-height: 84px;
    border-radius: 14px;
    box-shadow: 0 6px 18px rgba(13, 71, 161, 0.25);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .link-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(13, 71, 161, 0.35); }
  .link-btn:active { transform: scale(0.98); }
  .link-icon {
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .link-icon svg { width: 28px; height: 28px; }
  .link-text .lt { font-size: 1.08rem; font-weight: 700; margin-bottom: 3px; }
  .link-text .ld { font-size: 0.85rem; opacity: 0.88; }

  footer { text-align: center; color: rgba(255,255,255,0.85); font-size: 0.82rem; margin-top: 28px; }

  .greet {
    font-size: 1rem;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 4px;
    position: relative;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(5, 15, 35, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    animation: fade 0.2s ease-out;
  }
  .modal-bg[hidden] { display: none; }
  .modal {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    animation: pop 0.25s ease-out;
  }
  .modal .app-icon { width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto 10px; }
  .modal h3 { margin: 0 0 12px; color: var(--primary); text-align: center; font-size: 1.1rem; }
  .modal ol { padding-left: 20px; margin: 0 0 18px; line-height: 1.7; font-size: 0.95rem; }
  .modal-close {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- phone: fit everything on one screen ---------- */
  @media (max-width: 600px) {
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    header {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px;
      gap: 8px;
    }
    header h1 { font-size: 1rem; }
    header p { display: none; }
    .controls {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      width: 100%;
    }
    .ctrl-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 6px 4px;
      min-height: 34px;
      font-size: 0.74rem;
      border-radius: 8px;
      white-space: nowrap;
      text-align: center;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: none;
      width: 100%;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
      min-height: 0;
    }
    .card { padding: 8px 10px; border-radius: 12px; }

    .clock-card { margin-bottom: 0; padding: 6px 10px; }
    .clock-wrap { padding: 0 6px; gap: 6px; }
    .clock { font-size: 12vw; letter-spacing: 0; }
    .ampm { font-size: 0.7rem; margin-top: 4px; padding: 2px 6px; }
    .mode-hint { display: none; }
    .date-line { font-size: 0.82rem; margin-top: 0; }
    .hijri-line { font-size: 0.78rem; margin-top: 0; }
    .adjust { margin-top: 4px; font-size: 0.7rem; gap: 6px; }
    .adj-btn { width: 30px; height: 30px; font-size: 1rem; border-radius: 8px; }
    .adj-val { min-width: 26px; font-size: 0.85rem; }

    .cal-grid {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 0;
    }
    .cal-head { margin-bottom: 4px; gap: 2px; }
    .cal-head .section-title { font-size: 0.72rem; }
    .cal-month { font-size: 0.62rem; }
    .cal { gap: 2px; }
    .cal .wd { font-size: 0.55rem; padding: 1px 0; }
    .cal .cell { font-size: 0.66rem; padding: 3px 0; border-radius: 5px; }
    .cal .cell:not(.empty):hover { transform: none; }

    .links-title { display: none; }
    .links {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .link-btn {
      flex-direction: column;
      justify-content: center;
      text-align: center;
      gap: 4px;
      padding: 8px 4px;
      min-height: 0;
      border-radius: 12px;
    }
    .link-btn:hover { transform: none; }
    .link-icon { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; }
    .link-icon svg { width: 20px; height: 20px; }
    .link-text .lt { font-size: 0.7rem; line-height: 1.2; margin-bottom: 0; }
    .link-text .ld { display: none; }

    footer { display: none; }
  }
</style>
</head>
<body>

<script>
const I18N = {
  en: {
    subtitle: "Quick access to your systems",
    hijriAdjust: "Hijri adjust (days)",
    gregTitle: "Gregorian Calendar",
    hijriTitle: "Hijri Calendar",

    btn1Title: "Vacancy Process",

    btn2Title: "Holiday",
    btn2Desc: "Public holiday list",
    btn3Title: "Organisation Structure",
    btn3Desc: "Struktur organisasi",
    installBtn: "Install App",
    installTitle: "Install ZASYSTEM.147 Portal",
    installSteps: [

      "Choose \"Install app\" or \"Add to Home screen\".",

    ],
    installClose: "Close",

    gEvening: "Good evening",
    gNight: "Good night",
    langBtn: "BM",
    darkOn: "Dark Mode",
    darkOff: "Light Mode",
    hint12: "Tap clock for 24-hour",
    hint24: "Tap clock for 12-hour",
    weekdays: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
    gMonths: ["January","February","March","April","May","June","July","August","September","October","November","December"],
    hMonths: ["Muharram","Safar","Rabi al-Awwal","Rabi al-Thani","Jumada al-Awwal","Jumada al-Thani","Rajab","Sha'ban","Ramadan","Shawwal","Dhu al-Qa'dah","Dhu al-Hijjah"],
    hSuffix: "AH"
  },
  ms: {
    subtitle: "Akses pantas ke sistem anda",
    hijriAdjust: "Laras Hijrah (hari)",
    gregTitle: "Kalendar Masihi",
    hijriTitle: "Kalendar Hijrah",
    linksTitle: "Sistem",
    btn1Title: "Proses Jawatan Kosong",
    btn1Desc: "Penjejak jawatan kosong",
    btn2Title: "Cuti Umum",
    btn2Desc: "Senarai cuti umum",
    btn3Title: "Struktur Organisasi",
    btn3Desc: "Carta struktur organisasi",
    installBtn: "Pasang Aplikasi",
    installTitle: "Pasang ZASYSTEM.147 Portal",
    installSteps: [
      "Ketik menu (⋮) di bahagian atas kanan pelayar anda.",
      "Pilih \"Pasang aplikasi\" atau \"Tambah ke Skrin Utama\".",
      "Ketik Pasang. Ikon aplikasi akan muncul pada telefon anda."
    ],
    installClose: "Tutup",
    gMorning: "Selamat pagi",
    gAfternoon: "Selamat tengah hari",
    gEvening: "Selamat petang",
    gNight: "Selamat malam",
    langBtn: "EN",
    darkOn: "Mod Gelap",
    darkOff: "Mod Cerah",
    hint12: "Tekan jam untuk 24 jam",
    hint24: "Tekan jam untuk 12 jam",
    weekdays: ["Ahd","Isn","Sel","Rab","Kha","Jum","Sab"],
    gMonths: ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"],
    hMonths: ["Muharam","Safar","Rabiulawal","Rabiulakhir","Jamadilawal","Jamadilakhir","Rejab","Syaaban","Ramadan","Syawal","Zulkaedah","Zulhijjah"],
    hSuffix: "H"
  }
};

let lang = "en";
let dark = false;
let hour12 = true;
let lastDayKey = "";
let lastSec = -1;
let hOffset = 0;
let deferredPrompt = null;

// ---------- storage (wrapped, in case the browser blocks it) ----------
function loadSetting(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function saveSetting(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}

// ---------- helpers ----------
const hFmt = new Intl.DateTimeFormat("en-US-u-ca-islamic-umalqura", {
  day: "numeric", month: "numeric", year: "numeric"
});

function hParts(d) {
  const o = {};
  for (const p of hFmt.formatToParts(d)) {
    if (p.type === "day" || p.type === "month" || p.type === "year") o[p.type] = parseInt(p.value, 10);
  }
  return o;
}

function hijriOf(d) {
  return hParts(new Date(d.getFullYear(), d.getMonth(), d.getDate() + hOffset, 12));
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function t(key) { return I18N[lang][key]; }

// ---------- calendars ----------
function gregorianMonthDates(now) {
  const y = now.getFullYear(), m = now.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const out = [];
  for (let i = 1; i <= days; i++) out.push(new Date(y, m, i, 12));
  return { dates: out, label: t("gMonths")[m] + " " + y };
}

function hijriMonthDates(now) {
  let s = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
  let guard = 0;
  while (hijriOf(s).day !== 1 && guard++ < 40) s.setDate(s.getDate() - 1);
  const info = hijriOf(s);
  const out = [];
  const c = new Date(s);
  while (hijriOf(c).month === info.month && out.length < 31) {
    out.push(new Date(c));
    c.setDate(c.getDate() + 1);
  }
  return { dates: out, label: t("hMonths")[info.month - 1] + " " + info.year + " " + t("hSuffix") };
}

function renderCalendar(container, dates, labelFn) {
  const now = new Date();
  let html = "";
  t("weekdays").forEach(w => { html += '<div class="wd">' + w + "</div>"; });
  const offset = dates[0].getDay();
  for (let i = 0; i < offset; i++) html += '<div class="cell empty"></div>';
  dates.forEach(d => {
    html += '<div class="' + (sameDay(d, now) ? "cell today" : "cell") + '">' + labelFn(d) + "</div>";
  });
  container.innerHTML = html;
}

function renderCalendars() {
  const now = new Date();
  const g = gregorianMonthDates(now);
  renderCalendar(document.getElementById("gCal"), g.dates, d => d.getDate());
  document.getElementById("gMonthLabel").textContent = g.label;

  const h = hijriMonthDates(now);
  renderCalendar(document.getElementById("hCal"), h.dates, d => hijriOf(d).day);
  document.getElementById("hMonthLabel").textContent = h.label;
}

function updateDates() {
  const now = new Date();
  document.getElementById("gDate").textContent =
    now.getDate() + " " + t("gMonths")[now.getMonth()] + " " + now.getFullYear();
  const hp = hijriOf(now);
  document.getElementById("hDate").textContent =
    hp.day + " " + t("hMonths")[hp.month - 1] + " " + hp.year + " " + t("hSuffix");
}

// ---------- clock ----------
function renderClock(now) {
  let h = now.getHours();
  const m = pad(now.getMinutes());
  const s = now.getSeconds();
  let suffix = "";
  if (hour12) {
    suffix = h < 12 ? "AM" : "PM";
    h = h % 12;
    if (h === 0) h = 12;
  }
  const hh = hour12 ? String(h) : pad(h);

  const secChanged = s !== lastSec;
  lastSec = s;
  const secHtml = '<span class="sec' + (secChanged ? " tick" : "") + '">' + pad(s) + "</span>";

  document.getElementById("clock").innerHTML =
    hh + '<span class="colon">:</span>' + m + '<span class="colon">:</span>' + secHtml;

  const hr = now.getHours();
  document.getElementById("greet").textContent =
    hr < 11 ? t("gMorning") : hr < 15 ? t("gAfternoon") : hr < 19 ? t("gEvening") : t("gNight");

  const ampm = document.getElementById("ampm");
  ampm.hidden = !hour12;
  ampm.textContent = suffix;
}

function updateClock() {
  const now = new Date();
  renderClock(now);

  const dayKey = now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
  if (dayKey !== lastDayKey) {
    lastDayKey = dayKey;
    updateDates();
    renderCalendars();
  }
}

function toggleClockMode() {
  hour12 = !hour12;
  saveSetting("zs147-hour12", hour12 ? "1" : "0");
  applyHintLabel();
  lastSec = -1;
  updateClock();
}

function applyHintLabel() {
  document.getElementById("modeHint").textContent = hour12 ? t("hint12") : t("hint24");
}

const clockWrap = document.getElementById("clockWrap");
clockWrap.addEventListener("click", toggleClockMode);
clockWrap.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleClockMode(); }
});

// ---------- Hijri adjustment ----------
function setHijriOffset(v) {
  hOffset = Math.max(-2, Math.min(2, v));
  saveSetting("zs147-hijri-offset", String(hOffset));
  document.getElementById("hVal").textContent = (hOffset > 0 ? "+" : "") + hOffset;
  updateDates();
  renderCalendars();
}

document.getElementById("hMinus").addEventListener("click", () => setHijriOffset(hOffset - 1));
document.getElementById("hPlus").addEventListener("click", () => setHijriOffset(hOffset + 1));

// ---------- language & theme ----------
function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  document.getElementById("langBtn").textContent = t("langBtn");
  document.getElementById("installBtn").textContent = t("installBtn");
  applyDarkLabel();
  applyHintLabel();
  updateDates();
  renderCalendars();
}

function applyDarkLabel() {
  document.getElementById("darkBtn").textContent = dark ? t("darkOff") : t("darkOn");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0a1628" : "#8cd7f6");
}

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "ms" : "en";
  saveSetting("zs147-lang", lang);
  applyLanguage();
});

document.getElementById("darkBtn").addEventListener("click", () => {
  dark = !dark;
  saveSetting("zs147-dark", dark ? "1" : "0");
  document.documentElement.classList.toggle("dark", dark);
  document.body.classList.toggle("dark", dark);
  applyDarkLabel();
});

// ---------- install (Chrome / Edge) ----------
function isInstalled() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function openInstallHelp() {
  document.getElementById("installTitle").textContent = t("installTitle");
  const ol = document.getElementById("installSteps");
  ol.innerHTML = "";
  t("installSteps").forEach(step => {
    const li = document.createElement("li");
    li.textContent = step;
    ol.appendChild(li);
  });
  document.getElementById("installClose").textContent = t("installClose");
  document.getElementById("installModal").hidden = false;
}

function closeInstallHelp() {
  document.getElementById("installModal").hidden = true;
}

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
});

document.getElementById("installBtn").addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (choice.outcome === "accepted") document.getElementById("installBtn").hidden = true;
  } else {
    openInstallHelp();
  }
});

document.getElementById("installModal").addEventListener("click", e => {
  if (e.target.id === "installModal") closeInstallHelp();
});
document.getElementById("installClose").addEventListener("click", closeInstallHelp);

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  document.getElementById("installBtn").hidden = true;
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// ---------- init ----------
lang = loadSetting("zs147-lang", "en") === "ms" ? "ms" : "en";
dark = loadSetting("zs147-dark", "0") === "1";
document.documentElement.classList.toggle("dark", dark);
  document.body.classList.toggle("dark", dark);
hour12 = loadSetting("zs147-hour12", "1") !== "0";
hOffset = parseInt(loadSetting("zs147-hijri-offset", "0"), 10) || 0;
document.getElementById("hVal").textContent = (hOffset > 0 ? "+" : "") + hOffset;

if (isInstalled()) document.getElementById("installBtn").hidden = true;

applyLanguage();
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
